name: "ALERTA EC — Reportes, consultas y sugerencias"
description: "Comunica un problema, solicita una mejora o plantea una consulta sobre ALERTA EC."
labels:
  - "Needs review"
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a mejorar **ALERTA EC — by CLICK TV DIGITAL**. Esta aplicación es gratuita y está dirigida a toda la comunidad.

        **Importante:** este formulario no recibe emergencias en tiempo real. En Ecuador, si alguien necesita ayuda inmediata, comunícate con el **ECU 911**. Fuera de Ecuador, usa el servicio de emergencia local.

        **Privacidad:** no publiques coordenadas exactas, domicilios, información identificable de menores, nombres de víctimas, documentos, contraseñas, fotografías íntimas ni registros que contengan datos sensibles. Para estos asuntos utiliza **clicktvdigital@gmail.com**.
  - type: dropdown
    id: tipo
    attributes:
      label: "¿Qué deseas comunicar?"
      options:
        - "Error o fallo de la aplicación"
        - "Problema con ubicación, GPS o pronóstico"
        - "Problema con alertas o notificaciones"
        - "Accesibilidad o dificultad de uso"
        - "Instalación o actualización con Obtainium"
        - "Sugerencia o nueva función"
        - "Consulta general"
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: "Cuéntanos qué sucedió o qué propones"
      description: "Describe el problema o la idea con palabras sencillas. No incluyas datos privados."
      placeholder: "Por ejemplo: la alerta no apareció, qué esperabas ver o cómo podemos mejorar la aplicación."
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: "Pasos para reproducir (si corresponde)"
      description: "Opcional. Si es un fallo, indica cómo ocurrió sin compartir información sensible."
      placeholder: |
        1. Abrí la aplicación.
        2. Entré en una sección.
        3. Apareció el problema.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "Versión de ALERTA EC (si la conoces)"
      description: "Se puede consultar en Acerca de o en los ajustes de Android. Indica el número instalado, no una versión futura."
      placeholder: "Ejemplo: 0.1.5; o: No lo sé"
    validations:
      required: false
  - type: input
    id: android
    attributes:
      label: "Versión de Android (opcional)"
      placeholder: "Ejemplo: Android 14"
    validations:
      required: false
  - type: input
    id: dispositivo
    attributes:
      label: "Marca y modelo del dispositivo (opcional)"
      placeholder: "Ejemplo: Samsung Galaxy A54"
    validations:
      required: false
  - type: input
    id: fuente
    attributes:
      label: "Fuente meteorológica (solo si es relevante)"
      description: "Indícala únicamente si el problema se relaciona con el pronóstico o los datos meteorológicos."
      placeholder: "Ejemplo: Open-Meteo"
    validations:
      required: false
  - type: textarea
    id: detalles
    attributes:
      label: "Otros detalles no sensibles (opcional)"
      description: "Adjunta capturas únicamente después de ocultar ubicaciones, nombres y demás datos personales."
    validations:
      required: false
  - type: checkboxes
    id: confirmacion
    attributes:
      label: "Antes de enviar"
      options:
        - label: "He evitado incluir información privada o sensible de otras personas."
          required: true
        - label: "Entiendo que este formulario no comunica emergencias al ECU 911 ni ofrece asistencia inmediata."
          required: true
