name: Alerta EC - Verificacion continua

on:
  push:
    branches:
      - alerta-ec
  pull_request:
    branches:
      - alerta-ec

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Descargar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar recursos y documentación
        run: python scripts/validate_alerta_ec.py

      - name: Instalar herramientas de inspección de vídeo
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Decodificar intro y comprobar imagen inicial
        run: python scripts/validate_intro_media.py

      - name: Guardar fotogramas para revisión
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intro-review
          path: build/intro-review/
          if-no-files-found: warn

      - name: Preparar Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Verificar sintaxis del panel local
        run: python -m py_compile tools/alerta-ec-panel/app.py

      - name: Ejecutar pruebas unitarias Alerta EC
        run: ./gradlew :app:testBasicDebugUnitTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verificar compilacion Kotlin Release
        run: ./gradlew :app:compileBasicReleaseKotlin --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Compilar APK de prueba previa a release
        run: ./gradlew :app:assembleBasicDebug --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Guardar APK de prueba (sin publicar release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alerta-ec-prueba-post-v0.1.8-${{ github.sha }}
          path: app/build/outputs/apk/basic/debug/*.apk
          if-no-files-found: error
          retention-days: 7
