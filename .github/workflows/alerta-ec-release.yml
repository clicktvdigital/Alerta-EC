name: Alerta EC - Release firmada

on:
  push:
    tags:
      - "v0.1.4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configurar firma privada
        env:
          KEYSTORE_B64: ${{ secrets.ALERTAEC_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ALERTAEC_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ALERTAEC_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > app/alerta-ec-release.jks
          {
            echo "alertaec.storeFile=alerta-ec-release.jks"
            echo "alertaec.storePassword=$STORE_PASSWORD"
            echo "alertaec.keyAlias=alerta-ec"
            echo "alertaec.keyPassword=$KEY_PASSWORD"
          } >> local.properties
      - name: Compilar APK Release
        run: ./gradlew :app:assembleBasicRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
      - name: Crear GitHub Release v0.1.4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.4
          name: Alerta EC v0.1.4
          generate_release_notes: true
          prerelease: true
          files: app/build/outputs/apk/basic/release/*.apk

      - name: Publicar APK firmada
        uses: actions/upload-artifact@v4
        with:
          name: Alerta-EC-Release-Firmada
          path: app/build/outputs/apk/basic/release/*.apk
          if-no-files-found: error
          retention-days: 30
