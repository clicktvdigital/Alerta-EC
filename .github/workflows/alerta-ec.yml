name: Alerta EC - APK Debug

on:
  push:
    branches:
      - alerta-ec
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerta-ec-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK Debug
        run: ./gradlew :app:assembleBasicDebug --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Alerta-EC-Debug
          path: app/build/outputs/apk/basic/debug/*.apk
          if-no-files-found: error
          retention-days: 30
