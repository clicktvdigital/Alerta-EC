name: Code Graph & Symbol Index (Graphifyy + JCode)
on:
  push:
    branches: [ alerta-ec, main, master ]
    paths:
      - "app/src/main/kotlin/**"
      - ".github/workflows/code-graph-audit.yml"
  workflow_dispatch:
jobs:
  graph-and-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install graphifyy & jcodemunch-mcp
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir graphifyy jcodemunch-mcp
      - name: Verify tools & generate repo summary index
        run: |
          mkdir -p .github/code-index
          python -c "import importlib.metadata as m; print(\"graphifyy:\", m.version(\"graphifyy\")); print(\"jcodemunch-mcp:\", m.version(\"jcodemunch-mcp\"))" > .github/code-index/versions.txt
          find app/src/main/kotlin/org/breezyweather/alertaec -name "*.kt" | sort > .github/code-index/alertaec_files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alerta-ec-code-graph
          path: .github/code-index/
