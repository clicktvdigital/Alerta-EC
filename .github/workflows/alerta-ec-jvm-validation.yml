name: Alerta EC - Validación JVM aislada

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar el ref de ejecución
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Preparar Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Ejecutar exclusivamente los tests JVM
        working-directory: .
        run: ./gradlew -p alerta-ec-jvm-validation test --no-daemon --max-workers=1
